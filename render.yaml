# Render blueprint: one web service that polls civicAPI and serves the projection.
#
# Not a cron job. A cron container is destroyed after every run, which wipes the
# batch history mode_calibration needs, and it has no URL for a website to read.
# This service does both jobs by staying alive.
#
# Nothing else to configure. No object storage, no API tokens, no secrets.
#
# Layout is flat: every file sits at the repository root, including the three site
# files, because GitHub's web uploader does not preserve folders.

services:
  - type: web
    name: mi-senate-model
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: RACE_ID
        value: "84778"
      - key: N_SIMS
        value: "20000"
      - key: POLL_INTERVAL
        value: "60"

      # Optional. Set this to a mounted Render disk path (for example /var/data) if
      # you want batch history to survive a restart. Without it, a restart costs you
      # the mode gap calibration until counties finish counting again.
      # - key: STATE_DIR
      #   value: /var/data
